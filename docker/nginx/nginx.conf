# ================================================================
# AEGISX Platform - Nginx Reverse Proxy Configuration
# ================================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  4096;
    use  epoll;
    multi_accept  on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'rt=$request_time uct="$upstream_connect_time" '
                      'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main buffer=16k flush=5s;

    # ── Performance ──────────────────────────────────────────────
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    keepalive_requests  1000;
    types_hash_max_size 2048;
    client_max_body_size 100m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 32k;

    # ── Gzip Compression ─────────────────────────────────────────
    gzip  on;
    gzip_vary  on;
    gzip_proxied  any;
    gzip_comp_level  6;
    gzip_buffers  16 8k;
    gzip_http_version  1.1;
    gzip_min_length  256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        text/csv
        application/json
        application/javascript
        application/xml
        application/xml+rss
        application/atom+xml
        application/rss+xml
        application/x-javascript
        application/x-font-ttf
        application/x-font-opentype
        image/svg+xml
        image/x-icon
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # ── Real IP from Proxy ───────────────────────────────────────
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ── Rate Limiting Zones ──────────────────────────────────────
    # Global rate limit: 100 requests per second per IP
    limit_req_zone $binary_remote_addr zone=global:10m rate=100r/s;

    # API rate limit: 100 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/m;

    # Authentication rate limit: 10 requests per minute per IP
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;

    # Connection limit per IP
    limit_conn_zone $binary_remote_addr zone=connperip:10m;

    # ── Upstream Definitions ─────────────────────────────────────
    upstream backend {
        server backend:8000;
        keepalive 32;
    }

    upstream frontend {
        server frontend:3000;
        keepalive 32;
    }

    # ── Map for WebSocket Upgrade ────────────────────────────────
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ── HTTP → HTTPS Redirect (uncomment for production) ─────────
    # server {
    #     listen 80;
    #     server_name _;
    #     return 301 https://$host$request_uri;
    # }

    # ── Main Server Block ────────────────────────────────────────
    server {
        listen 80;
        # listen 443 ssl http2;  # Uncomment for HTTPS
        server_name _;

        # ── SSL / mTLS Certificate Settings ────────────────────────
        # ssl_certificate     /etc/nginx/certs/aegisx.crt;
        # ssl_certificate_key /etc/nginx/certs/aegisx.key;
        # 
        # ── mTLS (Mutual TLS) for service-to-service ──────────────
        # Enforce client certificate verification for internal services.
        # Uncomment and configure for production:
        # ssl_client_certificate  /etc/nginx/certs/ca.crt;
        # ssl_verify_client       optional;
        # ssl_verify_depth        2;
        #
        # ── TLS 1.3 Configuration ─────────────────────────────────
        # ssl_protocols       TLSv1.3;
        # ssl_ciphers         TLS_AES_256_GCM_SHA384:TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256;
        # ssl_prefer_server_ciphers off;
        # ssl_session_cache   shared:SSL:50m;
        # ssl_session_timeout 1d;
        # ssl_session_tickets off;
        # ssl_ecdh_curve      X25519:secp384r1:secp256r1;
        #
        # ── mTLS Map: Enforce for /api/internal paths ─────────────
        # map $ssl_client_verify $internal_access {
        #     "SUCCESS" "allow";
        #     default    "deny";
        # }
        #
        # location /api/internal {
        #     if ($internal_access = "deny") {
        #         return 403 '{"error":"mTLS client certificate required"}';
        #     }
        #     proxy_pass http://backend;
        #     proxy_http_version 1.1;
        #     proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
        #     proxy_set_header X-Client-Cert-Valid $ssl_client_verify;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_buffering off;
        #     proxy_read_timeout 300s;
        # }
        # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # ── Security Headers ─────────────────────────────────────
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Permitted-Cross-Domain-Policies "none" always;
        add_header X-Download-Options "noopen" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;

        # Server name hiding
        server_tokens off;
        # more_clear_headers 'Server';
        # more_clear_headers 'X-Powered-By';
        proxy_hide_header Server;
        proxy_hide_header X-Powered-By;

        # Connection limit
        limit_conn connperip 20;

        # ── Root: Frontend SPA ───────────────────────────────────
        location / {
            limit_req zone=global burst=50 nodelay;

            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 16k;
            proxy_busy_buffers_size 32k;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ── API Backend ──────────────────────────────────────────
        location /api {
            limit_req zone=api burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_buffering off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_connect_timeout 30s;
        }

        # ── Health Check Endpoints ───────────────────────────────
        location /health {
            limit_req zone=global burst=10 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_buffering off;
            proxy_read_timeout 10s;
            proxy_connect_timeout 5s;
        }

        # ── WebSocket Support ────────────────────────────────────
        location /ws {
            limit_req zone=global burst=20 nodelay;

            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_buffering off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── API Documentation ────────────────────────────────────
        location /docs {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        location /redoc {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 60s;
        }

        # ── OpenAPI Schema ───────────────────────────────────────
        location /openapi.json {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_buffering off;
        }

        # ── Deny Hidden Files ────────────────────────────────────
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}
