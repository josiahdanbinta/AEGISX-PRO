input {
  # Beats input for Filebeat/Winlogbeat agents
  beats {
    port => 5044
    host => "0.0.0.0"
  }

  # Syslog over TCP
  tcp {
    port => 5000
    type => "syslog"
    codec => "json_lines"
  }

  # Syslog over UDP
  udp {
    port => 5000
    type => "syslog"
    codec => "json"
  }
}

filter {
  if [type] == "syslog" {
    if [message] =~ /^<[0-9]+>/ {
      grok {
        match => {
          "message" => [
            "<%{NONNEGINT:syslog_pri}>%{NONNEGINT:syslog_version} %{TIMESTAMP_ISO8601:syslog_timestamp} %{DATA:syslog_hostname} %{DATA:syslog_app} %{DATA:syslog_procid} %{DATA:syslog_msgid} %{DATA:syslog_sd} %{GREEDYDATA:message}",
            "<%{NONNEGINT:syslog_pri}>%{SYSLOGTIMESTAMP:syslog_timestamp} %{DATA:syslog_hostname} %{GREEDYDATA:message}"
          ]
        }
      }
    }

    if [syslog_pri] {
      ruby {
        code => "
          if event.get('syslog_pri')
            pri = event.get('syslog_pri').to_i
            facility = pri / 8
            severity_code = pri % 8
            severities = ['emergency','alert','critical','error','warning','notice','info','debug']
            event.set('syslog_facility', facility)
            event.set('syslog_severity_code', severity_code)
            event.set('syslog_severity', severities[severity_code] || 'unknown')
          end
        "
      }
    }

    date {
      match => ["syslog_timestamp", "ISO8601", "MMM  d HH:mm:ss", "MMM dd HH:mm:ss"]
      target => "@timestamp"
      remove_field => ["syslog_timestamp"]
    }
  }

  if [host] and [host][hostname] {
    mutate { rename => { "[host][hostname]" => "hostname" } }
  }

  mutate {
    add_field => {
      "[@metadata][index_prefix]" => "aegisx"
      "platform" => "aegisx"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    manage_template => false
    ecs_compatibility => "disabled"
  }

  stdout {
    codec => json_lines
  }
}
