groups:
  - name: aegisx-platform-alerts
    rules:

      # ── Ingestion Rate ───────────────────────────────
      - alert: LowIngestionRate
        expr: |
          rate(aegisx_events_ingested_total[5m]) < 1
        for: 10m
        labels:
          severity: warning
          component: ingestion
        annotations:
          summary: "AEGISX event ingestion rate is critically low"
          description: "Less than 1 event/sec over the past 10 minutes. Check data sources and ingestion pipeline."

      - alert: HighIngestionRate
        expr: |
          rate(aegisx_events_ingested_total[5m]) > 10000
        for: 5m
        labels:
          severity: warning
          component: ingestion
        annotations:
          summary: "AEGISX event ingestion rate is abnormally high"
          description: "Over 10,000 events/sec. Verify for potential DoS or log storm."

      # ── Alert Latency ────────────────────────────────
      - alert: HighAlertLatency
        expr: |
          histogram_quantile(0.95, rate(aegisx_alert_generation_duration_seconds_bucket[5m])) > 10
        for: 10m
        labels:
          severity: warning
          component: detection
        annotations:
          summary: "Alert generation latency is high (P95 > 10s)"
          description: "95th percentile alert generation latency exceeds 10 seconds."

      # ── API Response Time ────────────────────────────
      - alert: SlowAPIResponse
        expr: |
          histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{handler!~"/metrics|/health"}[5m])) > 2
        for: 5m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "API response time is high (P95 > 2s)"
          description: "95th percentile API response time for {{ $labels.handler }} exceeds 2 seconds."

      - alert: HighAPIErrorRate
        expr: |
          rate(http_requests_total{status=~"5.."}[5m]) / rate(http_requests_total[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API error rate > 5%"
          description: "Server error rate for {{ $labels.handler }} is {{ $value | humanizePercentage }}."

      # ── Kafka Lag ─────────────────────────────────────
      - alert: KafkaConsumerLag
        expr: |
          sum(kafka_consumer_group_lag{group=~"aegisx.*"}) by (group, topic) > 10000
        for: 15m
        labels:
          severity: warning
          component: kafka
        annotations:
          summary: "Kafka consumer lag > 10,000"
          description: "Consumer group {{ $labels.group }} has {{ $value }} messages lagging on topic {{ $labels.topic }}."

      # ── Database Health ──────────────────────────────
      - alert: DatabaseConnectionPoolExhausted
        expr: |
          aegisx_db_connections_active / aegisx_db_connections_max > 0.9
        for: 5m
        labels:
          severity: critical
          component: database
        annotations:
          summary: "Database connection pool > 90% utilized"
          description: "Active connections at {{ $value | humanizePercentage }} of maximum."

      - alert: CacheErrorRate
        expr: |
          rate(redis_commands_failed_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          component: cache
        annotations:
          summary: "Redis error rate elevated"
          description: "Redis is experiencing {{ $value }} command failures/sec."

      # ── Stream Processing ─────────────────────────────
      - alert: StreamProcessorErrorRate
        expr: |
          rate(aegisx_stream_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: critical
          component: streaming
        annotations:
          summary: "Stream processing error rate high"
          description: "Stream processor errors at {{ $value }}/sec."

      # ── Component Health ─────────────────────────────
      - alert: ServiceDown
        expr: |
          up == 0
        for: 2m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Service {{ $labels.instance }} is down"
          description: "{{ $labels.instance }} has been unreachable for 2 minutes."

      # ── Disk Space ────────────────────────────────────
      - alert: LowDiskSpace
        expr: |
          (node_filesystem_avail_bytes / node_filesystem_size_bytes) < 0.1
        for: 5m
        labels:
          severity: critical
          component: infrastructure
        annotations:
          summary: "Less than 10% disk space available"
          description: "Filesystem on {{ $labels.instance }} at {{ $value | humanizePercentage }}."
