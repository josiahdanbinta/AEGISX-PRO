global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: docker
    platform: AEGIS

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: AEGIS-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka:9092"]
    metrics_path: /metrics

  - job_name: postgres
    static_configs:
      - targets: ["postgres:5432"]
    metrics_path: /metrics

  - job_name: redis
    static_configs:
      - targets: ["redis:6379"]
    metrics_path: /metrics

  - job_name: rabbitmq
    static_configs:
      - targets: ["rabbitmq:15692"]
    metrics_path: /metrics
