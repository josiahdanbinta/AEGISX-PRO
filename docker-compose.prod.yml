# ================================================================
# AEGIS â€” Production Docker Compose
# This file is for single-node production deployments.
# For multi-node, use Kubernetes Helm charts.
# ================================================================
# Usage:
#   1. Copy .env.production to .env and set all REQUIRED values
#   2. Generate TLS certs: bash docker/nginx/generate-mtls-certs.sh certs/
#   3. Launch: docker compose -f docker-compose.prod.yml up -d
# ================================================================
version: "3.9"

services:
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # DATA STORAGE
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

  timescaledb:
    image: timescale/timescaledb:2.16.1-pg15
    container_name: AEGIS-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-AEGIS}
      TIMESCALEDB_TELEMETRY: "off"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
      - ./docker/timescale/init.sql:/docker-entrypoint-initdb.d/01-timescale.sql:ro
      - ./docker/timescale/indexes.sql:/docker-entrypoint-initdb.d/02-indexes.sql:ro
    ports:
      - "127.0.0.1:5433:5432"
    networks:
      - AEGIS-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-AEGIS}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "4", memory: "8G" }
        reservations: { cpus: "1", memory: "2G" }
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "5" }
    command: >
      -c shared_preload_libraries='timescaledb'
      -c max_connections=200
      -c shared_buffers=2GB

  redis:
    image: redis:7-alpine
    container_name: AEGIS-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6380:6379"
    networks:
      - AEGIS-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "1", memory: "2G" }
        reservations: { cpus: "0.25", memory: "512M" }

  opensearch:
    image: opensearchproject/opensearch:2.14.0
    container_name: AEGIS-opensearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_INITIAL_ADMIN_PASSWORD: ${OPENSEARCH_PASSWORD:?required}
      OPENSEARCH_JAVA_OPTS: "-Xms2g -Xmx2g"
      cluster.name: AEGIS-prod
      bootstrap.memory_lock: "true"
    ulimits: { memlock: { soft: -1, hard: -1 }, nofile: { soft: 65536, hard: 65536 } }
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "127.0.0.1:9200:9200"
    networks:
      - AEGIS-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "4", memory: "8G" }
        reservations: { cpus: "1", memory: "2G" }

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    container_name: AEGIS-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: AEGIS
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?required}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    ports:
      - "127.0.0.1:8123:8123"
    networks:
      - AEGIS-network
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client -u ${CLICKHOUSE_USER} --password ${CLICKHOUSE_PASSWORD} -q 'SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { cpus: "2", memory: "4G" }
        reservations: { cpus: "0.5", memory: "1G" }

  minio:
    image: minio/minio:RELEASE.2024-08-29T01-40-52Z
    container_name: AEGIS-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9002:9000"
    networks:
      - AEGIS-network
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # MESSAGING & STREAMING
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: AEGIS-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    networks:
      - AEGIS-network
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    container_name: AEGIS-kafka-1
    restart: unless-stopped
    depends_on: { zookeeper: { condition: service_healthy } }
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
      KAFKA_LOG_RETENTION_HOURS: 168
    volumes:
      - kafka1_data:/var/lib/kafka/data
    networks:
      - AEGIS-network
    deploy:
      resources:
        limits: { cpus: "2", memory: "4G" }
        reservations: { cpus: "0.5", memory: "1G" }

  kafka-2:
    image: confluentinc/cp-kafka:7.6.1
    container_name: AEGIS-kafka-2
    restart: unless-stopped
    depends_on: { zookeeper: { condition: service_healthy } }
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
    volumes:
      - kafka2_data:/var/lib/kafka/data
    networks:
      - AEGIS-network
    deploy:
      resources:
        limits: { cpus: "2", memory: "4G" }
        reservations: { cpus: "0.5", memory: "1G" }

  kafka-3:
    image: confluentinc/cp-kafka:7.6.1
    container_name: AEGIS-kafka-3
    restart: unless-stopped
    depends_on: { zookeeper: { condition: service_healthy } }
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_NUM_PARTITIONS: 12
    volumes:
      - kafka3_data:/var/lib/kafka/data
    networks:
      - AEGIS-network
    deploy:
      resources:
        limits: { cpus: "2", memory: "4G" }
        reservations: { cpus: "0.5", memory: "1G" }

  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: AEGIS-schema-registry
    restart: unless-stopped
    depends_on: [kafka-1, kafka-2, kafka-3]
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka-1:9092,kafka-2:9092,kafka-3:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 3
    ports:
      - "127.0.0.1:8081:8081"
    networks:
      - AEGIS-network

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # APPLICATION SERVICES
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: AEGIS-backend
    restart: unless-stopped
    env_file: .env
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=timescaledb
      - POSTGRES_DB=${POSTGRES_DB:-AEGIS}
      - REDIS_HOST=redis
      - OPENSEARCH_HOST=opensearch
      - KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - CLICKHOUSE_HOST=clickhouse
      - MINIO_ENDPOINT=minio:9000
      - ELASTICSEARCH_HOST=elasticsearch
      - JAEGER_HOST=jaeger
      - RELOAD=false
      - DEBUG=false
      - LOG_LEVEL=WARNING
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
      kafka-1: { condition: service_healthy }
    networks:
      - AEGIS-network
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "2", memory: "2G" }
        reservations: { cpus: "0.5", memory: "512M" }

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: AEGIS-celery-worker
    restart: unless-stopped
    command: celery -A app.core.celery_config.celery_app worker --concurrency=4 --max-tasks-per-child=1000 --queues=agent,detection,notification,report,compliance,vulnerability,threat_intel,cleanup
    env_file: .env
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=timescaledb
      - REDIS_HOST=redis
      - KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - AEGIS-network
    deploy:
      resources:
        limits: { cpus: "2", memory: "2G" }
        reservations: { cpus: "0.5", memory: "512M" }

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: AEGIS-celery-beat
    restart: unless-stopped
    command: celery -A app.core.celery_config.celery_app beat --scheduler=celery.beat:PersistentScheduler
    env_file: .env
    environment:
      - APP_ENV=production
      - POSTGRES_HOST=timescaledb
      - REDIS_HOST=redis
    depends_on:
      timescaledb: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - AEGIS-network

  stream-processor:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: AEGIS-stream-processor
    restart: unless-stopped
    command: python -m app.streaming.processor
    env_file: .env
    environment:
      - APP_ENV=production
      - KAFKA_BOOTSTRAP_SERVERS=kafka-1:9092,kafka-2:9092,kafka-3:9092
      - SCHEMA_REGISTRY_URL=http://schema-registry:8081
      - REDIS_HOST=redis
      - POSTGRES_HOST=timescaledb
    depends_on:
      kafka-1: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - AEGIS-network
    deploy:
      replicas: 2
      resources:
        limits: { cpus: "2", memory: "2G" }

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    container_name: AEGIS-frontend
    restart: unless-stopped
    environment:
      - VITE_API_BASE_URL=/api/v1
    ports:
      - "127.0.0.1:5174:80"
    networks:
      - AEGIS-network
    depends_on: [backend]

  nginx:
    image: nginx:1.27-alpine
    container_name: AEGIS-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - AEGIS-network
    depends_on: [backend, frontend]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: "256M" }

  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•
  # OBSERVABILITY
  # â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•â•

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: AEGIS-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./docker/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - AEGIS-network

  grafana:
    image: grafana/grafana:11.1.4
    container_name: AEGIS-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?required}
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - AEGIS-network

  jaeger:
    image: jaegertracing/all-in-one:1.60
    container_name: AEGIS-jaeger
    restart: unless-stopped
    environment:
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_KEY: /badger/key
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_SPAN_STORE_TTL: 168h
    volumes:
      - jaeger_data:/badger
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - AEGIS-network

networks:
  AEGIS-network:
    name: AEGIS-network
    driver: bridge

volumes:
  timescaledb_data:
  redis_data:
  opensearch_data:
  clickhouse_data:
  minio_data:
  zookeeper_data:
  kafka1_data:
  kafka2_data:
  kafka3_data:
  prometheus_data:
  grafana_data:
  jaeger_data:
