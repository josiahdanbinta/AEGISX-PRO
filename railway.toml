# Railway.app — AEGISX Deployment
# 
# Deploy steps:
# 1. Push this repo to Railway
# 2. Add PostgreSQL plugin → auto-sets DATABASE_URL
# 3. Add Redis plugin → auto-sets REDIS_URL  
# 4. Set SECRET_KEY + JWT_SECRET_KEY + AGENT_REGISTRATION_KEY in Variables
# 5. Open Shell → run: python setup.py
# 6. Login: admin@aegisx.com / Admin123!@#

[build]
builder = "nixpacks"

[build.nixpacks]
# Install system dependencies before pip
aptPackages = ["libpq-dev", "gcc", "python3-dev"]

[deploy]
# Start command — Railway sets $PORT automatically
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-8000}"
healthcheckPath = "/health"
restartPolicyMaxRetries = 3

# ── Environment Variables ────────────────────────────────
[variables]
APP_NAME = "AEGISX"
APP_ENV = "production"
PYTHONUNBUFFERED = "1"
