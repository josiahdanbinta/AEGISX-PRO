global:
  environment: production
  imageRegistry: ghcr.io
  imagePullSecrets: []
  storageClass: ""
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

config:
  appName: "AEGISX"
  appEnv: "production"
  logLevel: "INFO"
  apiPrefix: "/api/v1"
  corsOrigins: "*"
  featureSOAR: true
  featureThreatIntel: true
  featureAI: true
  featureCompliance: true
  featureVulnerability: true
  featureAssetDiscovery: true

secrets:
  secretKey: ""
  jwtSecretKey: ""
  postgresPassword: ""
  redisPassword: ""
  agentRegistrationKey: ""
  openaiApiKey: ""

postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  postgresUser: aegisx
  postgresDb: aegisx

redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 6379
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

opensearch:
  enabled: true
  image:
    repository: opensearchproject/opensearch
    tag: "2.14.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 9200
  persistence:
    enabled: true
    size: 50Gi
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: "3.12-management-alpine"
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 5672
    managementPort: 15672
  persistence:
    enabled: true
    size: 10Gi
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

backend:
  replicaCount: 3
  image:
    repository: aegisx-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  livenessProbe:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5

celeryWorker:
  replicaCount: 2
  image:
    repository: aegisx-backend
    tag: latest
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

celeryBeat:
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

frontend:
  replicaCount: 2
  image:
    repository: aegisx-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
  hosts:
    - host: aegisx.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /health
          pathType: Prefix
          service: backend
        - path: /ws
          pathType: Prefix
          service: backend
  tls:
    - secretName: aegisx-tls
      hosts:
        - aegisx.example.com

networkPolicy:
  enabled: true
  backendEgress:
    - postgresql
    - redis
    - opensearch
    - rabbitmq

serviceAccount:
  create: true
  name: aegisx
  annotations: {}

podSecurityContext:
  fsGroup: 1001

monitoring:
  prometheus:
    enabled: false
    serviceMonitor:
      enabled: false
