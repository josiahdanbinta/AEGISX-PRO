global:
  environment: production
  imageRegistry: ghcr.io
  imagePullSecrets: []
  storageClass: ""
  securityContext:
    runAsNonRoot: true
    runAsUser: 1001
    fsGroup: 1001

config:
  appName: "AEGIS"
  appEnv: "production"
  logLevel: "INFO"
  apiPrefix: "/api/v1"
  corsOrigins: "*"
  featureSOAR: true
  featureThreatIntel: true
  featureAI: true
  featureCompliance: true
  featureVulnerability: true
  featureAssetDiscovery: true

secrets:
  secretKey: ""
  jwtSecretKey: ""
  postgresPassword: ""
  redisPassword: ""
  agentRegistrationKey: ""
  openaiApiKey: ""
  timescaledbPassword: ""
  minioRootPassword: ""
  clickhousePassword: ""
  grafanaAdminPassword: ""
  opensearchAdminPassword: ""
  rabbitmqErlangCookie: ""

# â”€â”€ PostgreSQL (OLTP) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
postgresql:
  enabled: true
  image:
    repository: postgres
    tag: "15-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 5432
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"
  postgresUser: AEGIS
  postgresDb: AEGIS

# â”€â”€ Redis (Cache + Session Store) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 1
  service:
    type: ClusterIP
    port: 6379
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  maxmemory: "1gb"
  maxmemoryPolicy: "allkeys-lru"
  exporter:
    enabled: true
    image:
      repository: oliver006/redis_exporter
      tag: v1.58.0
      pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# â”€â”€ OpenSearch (Search + Log Aggregation) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
opensearch:
  enabled: true
  image:
    repository: opensearchproject/opensearch
    tag: "2.14.0"
    pullPolicy: IfNotPresent
  clusterName: AEGIS-opensearch
  replicaCount: 3
  securityDisabled: "true"
  javaOpts:
    xms: "1g"
    xmx: "2g"
  service:
    type: ClusterIP
    port: 9200
  persistence:
    enabled: true
    size: 100Gi
    storageClass: ""
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

# â”€â”€ RabbitMQ (Message Broker) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
rabbitmq:
  enabled: true
  image:
    repository: rabbitmq
    tag: "3.12-management-alpine"
    pullPolicy: IfNotPresent
  replicaCount: 3
  defaultUser: AEGIS
  defaultVhost: "/"
  service:
    type: ClusterIP
    port: 5672
    managementPort: 15672
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# â”€â”€ Kafka (Event Streaming) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
kafka:
  enabled: true
  image:
    repository: apache/kafka
    tag: "3.7.0"
    pullPolicy: IfNotPresent
  replicaCount: 3
  persistence:
    enabled: true
    size: 100Gi
    storageClass: ""
  config:
    defaultPartitions: 12
    defaultReplicationFactor: 3
    minInSyncReplicas: 2
    retentionHours: 168
    retentionBytes: "107374182400"
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

# â”€â”€ Schema Registry (Kafka) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
schemaRegistry:
  enabled: true
  image:
    repository: confluentinc/cp-schema-registry
    tag: "7.6.0"
    pullPolicy: IfNotPresent
  replicaCount: 2
  replicationFactor: 3
  compatibilityLevel: "full_transitive"
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# â”€â”€ TimescaleDB (Time-Series Events) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
timescaledb:
  enabled: true
  image:
    repository: timescale/timescaledb
    tag: "2.14.2-pg15"
    pullPolicy: IfNotPresent
  replicaCount: 2
  postgresUser: AEGIS
  postgresDb: AEGIS_tsdb
  persistence:
    enabled: true
    size: 200Gi
    storageClass: ""
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "8Gi"

# â”€â”€ ClickHouse (Columnar Analytics) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
clickhouse:
  enabled: true
  image:
    repository: clickhouse/clickhouse-server
    tag: "24.3"
    pullPolicy: IfNotPresent
  replicaCount: 2
  username: AEGIS
  password: ""
  dbName: AEGIS_analytics
  persistence:
    enabled: true
    size: 100Gi
    storageClass: ""
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# â”€â”€ MinIO (S3-Compatible Object Storage) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
minio:
  enabled: true
  image:
    repository: minio/minio
    tag: "RELEASE.2024-06-13T22-53-53Z"
    pullPolicy: IfNotPresent
  replicaCount: 4
  rootUser: AEGIS
  persistence:
    enabled: true
    size: 250Gi
    storageClass: ""
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2"
      memory: "4Gi"

# â”€â”€ Apache Flink (Stream Processing) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
flink:
  enabled: true
  image:
    repository: flink
    tag: "1.18.1-scala_2.12-java11"
    pullPolicy: IfNotPresent
  parallelism: 8
  jobmanager:
    replicas: 2
    memory: "2g"
    resources:
      requests:
        cpu: "1"
        memory: "2Gi"
      limits:
        cpu: "2"
        memory: "4Gi"
  taskmanager:
    replicas: 3
    slots: 8
    memory: "4g"
    resources:
      requests:
        cpu: "2"
        memory: "4Gi"
      limits:
        cpu: "4"
        memory: "8Gi"

# â”€â”€ Backend (FastAPI) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
backend:
  replicaCount: 3
  image:
    repository: AEGIS-backend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 8000
  resources:
    requests:
      cpu: "500m"
      memory: "512Mi"
    limits:
      cpu: "2"
      memory: "2Gi"
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80
  livenessProbe:
    path: /health/live
    initialDelaySeconds: 10
    periodSeconds: 10
  readinessProbe:
    path: /health/ready
    initialDelaySeconds: 5
    periodSeconds: 5

celeryWorker:
  replicaCount: 2
  image:
    repository: AEGIS-backend
    tag: latest
  resources:
    requests:
      cpu: "250m"
      memory: "256Mi"
    limits:
      cpu: "1"
      memory: "1Gi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
    targetMemoryUtilizationPercentage: 80

celeryBeat:
  replicaCount: 1
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# â”€â”€ Frontend (React SPA) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
frontend:
  replicaCount: 2
  image:
    repository: AEGIS-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "256Mi"
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 5
    targetCPUUtilizationPercentage: 70

# â”€â”€ Prometheus (Metrics) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
prometheus:
  enabled: true
  image:
    repository: prom/prometheus
    tag: v2.52.0
    pullPolicy: IfNotPresent
  scrapeInterval: "15s"
  retentionTime: "15d"
  retentionSize: "50GB"
  persistence:
    enabled: true
    size: 50Gi
    storageClass: ""
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "2Gi"

# â”€â”€ Grafana (Dashboards) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
grafana:
  enabled: true
  image:
    repository: grafana/grafana
    tag: "11.0.0"
    pullPolicy: IfNotPresent
  replicaCount: 1
  adminUser: admin
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"

# â”€â”€ Jaeger (Distributed Tracing) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
jaeger:
  enabled: true
  image:
    repository: jaegertracing/all-in-one
    tag: "1.57"
    pullPolicy: IfNotPresent
  storageType: badger
  maxTraces: 50000
  persistence:
    enabled: true
    size: 20Gi
    storageClass: ""
  resources:
    requests:
      cpu: "250m"
      memory: "512Mi"
    limits:
      cpu: "1"
      memory: "1Gi"

# â”€â”€ ArgoCD (GitOps) â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
argocd:
  enabled: false
  repoURL: https://github.com/org/AEGIS
  targetRevision: main
  path: kubernetes/helm/AEGIS
  valuesFile: values-prod.yaml

sealedSecrets:
  enabled: false

# â”€â”€ Ingress â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
ingress:
  enabled: true
  className: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  hosts:
    - host: AEGIS.example.com
      paths:
        - path: /
          pathType: Prefix
          service: frontend
        - path: /api
          pathType: Prefix
          service: backend
        - path: /health
          pathType: Prefix
          service: backend
        - path: /ws
          pathType: Prefix
          service: backend
        - path: /grafana
          pathType: Prefix
          service: grafana
  tls:
    - secretName: AEGIS-tls
      hosts:
        - AEGIS.example.com

# â”€â”€ Network Policies â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
networkPolicy:
  enabled: true
  backendEgress:
    - postgresql
    - timescaledb
    - clickhouse
    - redis
    - opensearch
    - rabbitmq
    - kafka
    - minio
    - schema-registry

serviceAccount:
  create: true
  name: AEGIS
  annotations: {}

podSecurityContext:
  fsGroup: 1001

# â”€â”€ Pod Disruption Budgets â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€â”€
podDisruptionBudget:
  enabled: true
  components:
    - name: postgresql
      maxUnavailable: 0
    - name: timescaledb
      maxUnavailable: 1
    - name: clickhouse
      maxUnavailable: 1
    - name: redis
      maxUnavailable: 1
    - name: opensearch
      maxUnavailable: 1
    - name: rabbitmq
      maxUnavailable: 1
    - name: kafka
      maxUnavailable: 1
    - name: minio
      maxUnavailable: 2
    - name: backend
      minAvailable: 2

# â”€â”€ Monitoring (Legacy â€” now using dedicated Prometheus/Grafana)
monitoring:
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
