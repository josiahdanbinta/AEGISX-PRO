{{- if .Values.opensearch.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisx.fullname" . }}-opensearch
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  replicas: {{ .Values.opensearch.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegisx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: opensearch
  template:
    metadata:
      labels:
        {{- include "aegisx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: opensearch
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: opensearch
          image: {{ include "aegisx.image" (dict "imageRoot" .Values.opensearch.image "Values" .Values) }}
          imagePullPolicy: {{ .Values.opensearch.image.pullPolicy }}
          env:
            - name: discovery.type
              value: "single-node"
            - name: DISABLE_SECURITY_PLUGIN
              value: "true"
            - name: DISABLE_INSTALL_DEMO_CONFIG
              value: "true"
            - name: OPENSEARCH_JAVA_OPTS
              value: "-Xms1g -Xmx1g"
          ports:
            - name: http
              containerPort: {{ .Values.opensearch.service.port }}
              protocol: TCP
            - name: transport
              containerPort: 9300
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /_cluster/health
              port: {{ .Values.opensearch.service.port }}
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /_cluster/health
              port: {{ .Values.opensearch.service.port }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.opensearch.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          {{- if .Values.opensearch.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /usr/share/opensearch/data
          {{- end }}
      {{- if .Values.opensearch.persistence.enabled }}
      volumes:
        - name: data
          emptyDir:
            sizeLimit: {{ .Values.opensearch.persistence.size }}
      {{- end }}
{{- end }}
