{{- if .Values.sealedSecrets.enabled }}
# SealedSecret for encrypting secrets at rest in Git
# Usage: kubeseal < secret.yaml > sealed-secret.yaml
# Then commit sealed-secret.yaml to Git. The SealedSecret controller
# decrypts it into a regular Secret in the cluster.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: {{ include "AEGIS.fullname" . }}-secrets
  namespace: {{ include "AEGIS.namespace" . }}
  labels:
    {{- include "AEGIS.labels" . | nindent 4 }}
spec:
  encryptedData:
    SECRET_KEY: {{ .Values.sealedSecrets.encryptedSecretKey | quote }}
    JWT_SECRET_KEY: {{ .Values.sealedSecrets.encryptedJwtSecretKey | quote }}
    POSTGRES_PASSWORD: {{ .Values.sealedSecrets.encryptedPostgresPassword | quote }}
    REDIS_PASSWORD: {{ .Values.sealedSecrets.encryptedRedisPassword | quote }}
    TIMESCALEDB_PASSWORD: {{ .Values.sealedSecrets.encryptedTimescaledbPassword | quote }}
    MINIO_ROOT_PASSWORD: {{ .Values.sealedSecrets.encryptedMinioPassword | quote }}
    CLICKHOUSE_PASSWORD: {{ .Values.sealedSecrets.encryptedClickhousePassword | quote }}
    GRAFANA_ADMIN_PASSWORD: {{ .Values.sealedSecrets.encryptedGrafanaPassword | quote }}
    OPENSEARCH_ADMIN_PASSWORD: {{ .Values.sealedSecrets.encryptedOpensearchPassword | quote }}
    AGENT_REGISTRATION_KEY: {{ .Values.sealedSecrets.encryptedAgentKey | quote }}
    OPENAI_API_KEY: {{ .Values.sealedSecrets.encryptedOpenaiKey | default "" | quote }}
  template:
    metadata:
      name: {{ include "AEGIS.fullname" . }}-secrets
      namespace: {{ include "AEGIS.namespace" . }}
      labels:
        {{- include "AEGIS.labels" . | nindent 8 }}
    type: Opaque
{{- end }}
