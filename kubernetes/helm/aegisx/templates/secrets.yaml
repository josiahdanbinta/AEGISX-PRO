apiVersion: v1
kind: Secret
metadata:
  name: {{ include "aegisx.fullname" . }}-secrets
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  AGENT_REGISTRATION_KEY: {{ .Values.secrets.agentRegistrationKey | quote }}
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  TIMESCALEDB_PASSWORD: {{ .Values.secrets.timescaledbPassword | default .Values.secrets.postgresPassword | quote }}
  MINIO_ROOT_PASSWORD: {{ .Values.secrets.minioRootPassword | quote }}
  CLICKHOUSE_PASSWORD: {{ .Values.secrets.clickhousePassword | quote }}
  GRAFANA_ADMIN_PASSWORD: {{ .Values.secrets.grafanaAdminPassword | quote }}
  OPENSEARCH_ADMIN_PASSWORD: {{ .Values.secrets.opensearchAdminPassword | required "opensearchAdminPassword is required" | quote }}
  RABBITMQ_PASSWORD: {{ .Values.secrets.rabbitmqPassword | default .Values.secrets.redisPassword | quote }}
  RABBITMQ_ERLANG_COOKIE: {{ .Values.secrets.rabbitmqErlangCookie | default (randAlphaNum 32) | quote }}
