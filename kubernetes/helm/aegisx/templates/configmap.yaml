apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegisx.fullname" . }}-config
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  API_PREFIX: {{ .Values.config.apiPrefix | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  FEATURE_SOAR: {{ .Values.config.featureSOAR | toString | quote }}
  FEATURE_THREAT_INTEL: {{ .Values.config.featureThreatIntel | toString | quote }}
  FEATURE_AI: {{ .Values.config.featureAI | toString | quote }}
  FEATURE_COMPLIANCE: {{ .Values.config.featureCompliance | toString | quote }}
  FEATURE_VULNERABILITY: {{ .Values.config.featureVulnerability | toString | quote }}
  FEATURE_ASSET_DISCOVERY: {{ .Values.config.featureAssetDiscovery | toString | quote }}
  POSTGRES_HOST: {{ include "aegisx.fullname" . }}-postgresql
  POSTGRES_PORT: {{ .Values.postgresql.service.port | quote }}
  POSTGRES_USER: {{ .Values.postgresql.postgresUser | quote }}
  POSTGRES_DB: {{ .Values.postgresql.postgresDb | quote }}
  REDIS_HOST: {{ include "aegisx.fullname" . }}-redis
  REDIS_PORT: {{ .Values.redis.service.port | quote }}
  OPENSEARCH_HOST: {{ include "aegisx.fullname" . }}-opensearch
  OPENSEARCH_PORT: {{ .Values.opensearch.service.port | quote }}
  RABBITMQ_HOST: {{ include "aegisx.fullname" . }}-rabbitmq
  RABBITMQ_PORT: {{ .Values.rabbitmq.service.port | quote }}
