apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "AEGIS.fullname" . }}-config
  labels:
    {{- include "AEGIS.labels" . | nindent 4 }}
data:
  APP_NAME: {{ .Values.config.appName | quote }}
  APP_ENV: {{ .Values.config.appEnv | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  API_PREFIX: {{ .Values.config.apiPrefix | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  FEATURE_SOAR: {{ .Values.config.featureSOAR | toString | quote }}
  FEATURE_THREAT_INTEL: {{ .Values.config.featureThreatIntel | toString | quote }}
  FEATURE_AI: {{ .Values.config.featureAI | toString | quote }}
  FEATURE_COMPLIANCE: {{ .Values.config.featureCompliance | toString | quote }}
  FEATURE_VULNERABILITY: {{ .Values.config.featureVulnerability | toString | quote }}
  FEATURE_ASSET_DISCOVERY: {{ .Values.config.featureAssetDiscovery | toString | quote }}
  # Data Stores
  POSTGRES_HOST: {{ include "AEGIS.fullname" . }}-postgresql-lb
  POSTGRES_PORT: {{ .Values.postgresql.service.port | quote }}
  POSTGRES_USER: {{ .Values.postgresql.postgresUser | quote }}
  POSTGRES_DB: {{ .Values.postgresql.postgresDb | quote }}
  TIMESCALEDB_HOST: {{ include "AEGIS.fullname" . }}-timescaledb
  TIMESCALEDB_PORT: "5432"
  TIMESCALEDB_DB: {{ .Values.timescaledb.postgresDb | default "AEGIS_tsdb" | quote }}
  CLICKHOUSE_HOST: {{ include "AEGIS.fullname" . }}-clickhouse-lb
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: {{ .Values.clickhouse.dbName | default "AEGIS_analytics" | quote }}
  REDIS_HOST: {{ include "AEGIS.fullname" . }}-redis-lb
  REDIS_PORT: {{ .Values.redis.service.port | quote }}
  OPENSEARCH_HOST: {{ include "AEGIS.fullname" . }}-opensearch-lb
  OPENSEARCH_PORT: {{ .Values.opensearch.service.port | quote }}
  RABBITMQ_HOST: {{ include "AEGIS.fullname" . }}-rabbitmq-lb
  RABBITMQ_PORT: {{ .Values.rabbitmq.service.port | quote }}
  # Streaming
  KAFKA_BOOTSTRAP_SERVERS: {{ include "AEGIS.fullname" . }}-kafka-bootstrap:9092
  SCHEMA_REGISTRY_URL: http://{{ include "AEGIS.fullname" . }}-schema-registry:8081
  # Object Storage
  MINIO_ENDPOINT: {{ include "AEGIS.fullname" . }}-minio-lb:9000
  MINIO_ACCESS_KEY: {{ .Values.minio.rootUser | quote }}
  MINIO_BUCKET_EVIDENCE: AEGIS-evidence
  MINIO_BUCKET_ARTIFACTS: AEGIS-artifacts
  # Observability
  PROMETHEUS_URL: http://{{ include "AEGIS.fullname" . }}-prometheus:9090
  JAEGER_AGENT_HOST: {{ include "AEGIS.fullname" . }}-jaeger-collector
  JAEGER_AGENT_PORT: "14250"
  JAEGER_SAMPLER_TYPE: probabilistic
  JAEGER_SAMPLER_PARAM: "0.1"
  # Detection Rules (ConfigMap hot-reload)
  AEGIS_RULES_DIR: /etc/AEGIS/rules
  AEGIS_RULES_CHECK_INTERVAL: "30"
  # Notification Defaults
  NOTIFICATION_SLACK_ENABLED: "false"
  NOTIFICATION_TEAMS_ENABLED: "false"
  NOTIFICATION_PAGERDUTY_ENABLED: "false"
  NOTIFICATION_DISCORD_ENABLED: "false"
  # Backup
  BACKUP_ENABLED: "true"
  BACKUP_SCHEDULE_CRON: "0 2 * * *"
  BACKUP_RETENTION_DAYS: "30"
