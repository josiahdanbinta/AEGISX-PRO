{{- if .Values.flink.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegisx.fullname" . }}-flink-jobmanager
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
    app.kubernetes.io/component: flink-jobmanager
spec:
  type: ClusterIP
  ports:
    - name: rpc
      port: 6123
      targetPort: 6123
    - name: blob
      port: 6124
      targetPort: 6124
    - name: ui
      port: 8081
      targetPort: 8081
  selector:
    {{- include "aegisx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: flink-jobmanager
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegisx.fullname" . }}-flink-taskmanager
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
    app.kubernetes.io/component: flink-taskmanager
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - name: data
      port: 6121
      targetPort: 6121
    - name: rpc
      port: 6122
      targetPort: 6122
  selector:
    {{- include "aegisx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: flink-taskmanager
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "aegisx.fullname" . }}-flink-config
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
    app.kubernetes.io/component: flink
data:
  flink-conf.yaml: |
    jobmanager.rpc.address: {{ include "aegisx.fullname" . }}-flink-jobmanager
    jobmanager.rpc.port: 6123
    jobmanager.memory.process.size: {{ .Values.flink.jobmanager.memory }}
    taskmanager.memory.process.size: {{ .Values.flink.taskmanager.memory }}
    taskmanager.numberOfTaskSlots: {{ .Values.flink.taskmanager.slots }}
    parallelism.default: {{ .Values.flink.parallelism }}
    state.backend: rocksdb
    state.backend.rocksdb.localdir: /data/rocksdb
    state.checkpoints.dir: file:///data/checkpoints
    state.savepoints.dir: file:///data/savepoints
    execution.checkpointing.interval: 60s
    execution.checkpointing.min-pause: 30s
    execution.checkpointing.timeout: 10min
    execution.checkpointing.max-concurrent-checkpoints: 2
    restart-strategy: fixed-delay
    restart-strategy.fixed-delay.attempts: 10
    restart-strategy.fixed-delay.delay: 30s
    jobmanager.execution.failover-strategy: region
    web.submit.enable: false
    metrics.reporters: prom
    metrics.reporter.prom.class: org.apache.flink.metrics.prometheus.PrometheusReporter
    metrics.reporter.prom.port: 9249
    pipeline.object-reuse: true
    taskmanager.network.memory.min: 128mb
    taskmanager.network.memory.max: 1gb
    taskmanager.network.memory.fraction: 0.15
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisx.fullname" . }}-flink-jobmanager
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
    app.kubernetes.io/component: flink-jobmanager
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "aegisx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: flink-jobmanager
  template:
    metadata:
      labels:
        {{- include "aegisx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: flink-jobmanager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9249"
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: flink-jobmanager
          image: {{ include "aegisx.image" (dict "imageRoot" .Values.flink.image "Values" .Values) }}
          imagePullPolicy: {{ .Values.flink.image.pullPolicy }}
          command: ["/opt/flink/bin/jobmanager.sh", "start-foreground"]
          args:
            - -Djobmanager.rpc.address={{ include "aegisx.fullname" . }}-flink-jobmanager
          ports:
            - name: rpc
              containerPort: 6123
            - name: blob
              containerPort: 6124
            - name: ui
              containerPort: 8081
            - name: metrics
              containerPort: 9249
          volumeMounts:
            - name: flink-config
              mountPath: /opt/flink/conf/flink-conf.yaml
              subPath: flink-conf.yaml
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 6123
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 6123
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.flink.jobmanager.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 9999
            allowPrivilegeEscalation: false
      volumes:
        - name: flink-config
          configMap:
            name: {{ include "aegisx.fullname" . }}-flink-config
        - name: data
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisx.fullname" . }}-flink-taskmanager
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
    app.kubernetes.io/component: flink-taskmanager
spec:
  replicas: {{ .Values.flink.taskmanager.replicas }}
  selector:
    matchLabels:
      {{- include "aegisx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: flink-taskmanager
  template:
    metadata:
      labels:
        {{- include "aegisx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: flink-taskmanager
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9249"
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app.kubernetes.io/component
                      operator: In
                      values: ["flink-taskmanager"]
                topologyKey: kubernetes.io/hostname
      containers:
        - name: flink-taskmanager
          image: {{ include "aegisx.image" (dict "imageRoot" .Values.flink.image "Values" .Values) }}
          imagePullPolicy: {{ .Values.flink.image.pullPolicy }}
          command: ["/opt/flink/bin/taskmanager.sh", "start-foreground"]
          args:
            - -Djobmanager.rpc.address={{ include "aegisx.fullname" . }}-flink-jobmanager
          ports:
            - name: data
              containerPort: 6121
            - name: rpc
              containerPort: 6122
            - name: metrics
              containerPort: 9249
          volumeMounts:
            - name: flink-config
              mountPath: /opt/flink/conf/flink-conf.yaml
              subPath: flink-conf.yaml
            - name: data
              mountPath: /data
          livenessProbe:
            tcpSocket:
              port: 6122
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            tcpSocket:
              port: 6122
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.flink.taskmanager.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 9999
            allowPrivilegeEscalation: false
      volumes:
        - name: flink-config
          configMap:
            name: {{ include "aegisx.fullname" . }}-flink-config
        - name: data
          emptyDir: {}
{{- end }}
