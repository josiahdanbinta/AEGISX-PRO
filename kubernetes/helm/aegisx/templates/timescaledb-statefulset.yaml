{{- if .Values.timescaledb.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "AEGIS.fullname" . }}-timescaledb
  labels:
    {{- include "AEGIS.labels" . | nindent 4 }}
    app.kubernetes.io/component: timescaledb
spec:
  type: ClusterIP
  ports:
    - name: postgresql
      port: 5432
      targetPort: 5432
  selector:
    {{- include "AEGIS.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: timescaledb
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "AEGIS.fullname" . }}-timescaledb
  labels:
    {{- include "AEGIS.labels" . | nindent 4 }}
    app.kubernetes.io/component: timescaledb
spec:
  serviceName: {{ include "AEGIS.fullname" . }}-timescaledb
  replicas: {{ .Values.timescaledb.replicaCount }}
  selector:
    matchLabels:
      {{- include "AEGIS.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: timescaledb
  template:
    metadata:
      labels:
        {{- include "AEGIS.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: timescaledb
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        fsGroup: 1001
      containers:
        - name: timescaledb
          image: {{ include "AEGIS.image" (dict "imageRoot" .Values.timescaledb.image "Values" .Values) }}
          imagePullPolicy: {{ .Values.timescaledb.image.pullPolicy }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.timescaledb.postgresUser | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "AEGIS.fullname" . }}-secrets
                  key: TIMESCALEDB_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.timescaledb.postgresDb | quote }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: TIMESCALEDB_TELEMETRY
              value: "off"
          ports:
            - name: postgresql
              containerPort: 5432
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.timescaledb.postgresUser }}
                - -d
                - {{ .Values.timescaledb.postgresDb }}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.timescaledb.postgresUser }}
                - -d
                - {{ .Values.timescaledb.postgresDb }}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.timescaledb.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "AEGIS.labels" . | nindent 10 }}
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.timescaledb.persistence.storageClass }}
        storageClassName: {{ .Values.timescaledb.persistence.storageClass }}
        {{- else if .Values.global.storageClass }}
        storageClassName: {{ .Values.global.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.timescaledb.persistence.size }}
{{- end }}
