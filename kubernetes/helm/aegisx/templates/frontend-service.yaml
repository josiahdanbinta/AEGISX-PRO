apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegisx.fullname" . }}-frontend
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "aegisx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
