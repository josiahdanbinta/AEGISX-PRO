{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisx.fullname" . }}-backend
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  podSelector:
    matchLabels:
      {{- include "aegisx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: frontend
      ports:
        - port: http
          protocol: TCP
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: http
          protocol: TCP
  egress:
    {{- if has "postgresql" .Values.networkPolicy.backendEgress }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: postgresql
      ports:
        - port: {{ .Values.postgresql.service.port }}
          protocol: TCP
    {{- end }}
    {{- if has "timescaledb" .Values.networkPolicy.backendEgress }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: timescaledb
      ports:
        - port: 5432
          protocol: TCP
    {{- end }}
    {{- if has "clickhouse" .Values.networkPolicy.backendEgress }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: clickhouse
      ports:
        - port: 8123
          protocol: TCP
        - port: 9000
          protocol: TCP
    {{- end }}
    {{- if has "redis" .Values.networkPolicy.backendEgress }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: redis
      ports:
        - port: {{ .Values.redis.service.port }}
          protocol: TCP
    {{- end }}
    {{- if has "opensearch" .Values.networkPolicy.backendEgress }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: opensearch
      ports:
        - port: {{ .Values.opensearch.service.port }}
          protocol: TCP
        - port: 9300
          protocol: TCP
    {{- end }}
    {{- if has "rabbitmq" .Values.networkPolicy.backendEgress }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: rabbitmq
      ports:
        - port: {{ .Values.rabbitmq.service.port }}
          protocol: TCP
    {{- end }}
    {{- if has "kafka" .Values.networkPolicy.backendEgress }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: kafka
      ports:
        - port: 9092
          protocol: TCP
    {{- end }}
    {{- if has "minio" .Values.networkPolicy.backendEgress }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: minio
      ports:
        - port: 9000
          protocol: TCP
    {{- end }}
    {{- if has "schema-registry" .Values.networkPolicy.backendEgress }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: schema-registry
      ports:
        - port: 8081
          protocol: TCP
    {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisx.fullname" . }}-frontend
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  podSelector:
    matchLabels:
      {{- include "aegisx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: frontend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: http
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aegisx.fullname" . }}-datastores
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
    app.kubernetes.io/component: datastores
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values:
          - postgresql
          - timescaledb
          - redis
          - opensearch
          - rabbitmq
          - kafka
          - minio
          - clickhouse
          - schema-registry
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: backend
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: celery-worker
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: flink-jobmanager
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: flink-taskmanager
    - from:
        - namespaceSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "aegisx.name" . }}
{{- end }}
