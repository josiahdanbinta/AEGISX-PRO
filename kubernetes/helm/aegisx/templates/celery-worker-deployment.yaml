apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aegisx.fullname" . }}-celery-worker
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
    app.kubernetes.io/component: celery-worker
spec:
  replicas: {{ .Values.celeryWorker.replicaCount }}
  selector:
    matchLabels:
      {{- include "aegisx.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        {{- include "aegisx.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: celery-worker
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: celery-worker
          image: {{ include "aegisx.image" (dict "imageRoot" .Values.celeryWorker.image "Values" .Values) }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["celery"]
          args: ["-A", "aegisx", "worker", "-l", {{ .Values.config.logLevel | lower | quote }}]
          envFrom:
            - configMapRef:
                name: {{ include "aegisx.fullname" . }}-config
            - secretRef:
                name: {{ include "aegisx.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.celeryWorker.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: {{ .Values.global.securityContext.runAsUser }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
