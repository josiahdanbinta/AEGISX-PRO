{{- if .Values.opensearch.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegisx.fullname" . }}-opensearch
  labels:
    {{- include "aegisx.labels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
spec:
  type: {{ .Values.opensearch.service.type }}
  ports:
    - port: {{ .Values.opensearch.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "aegisx.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: opensearch
{{- end }}
