# AEGISX Kubernetes Base Configuration
# Usage: kubectl apply -k kubernetes/overlays/dev/

apiVersion: v1
kind: Namespace
metadata:
  name: aegisx
  labels:
    app.kubernetes.io/name: aegisx
    app.kubernetes.io/part-of: aegisx-platform
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: aegisx-quota
  namespace: aegisx
spec:
  hard:
    requests.cpu: "32"
    requests.memory: 64Gi
    limits.cpu: "64"
    limits.memory: 128Gi
    persistentvolumeclaims: "20"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: aegisx-config
  namespace: aegisx
data:
  APP_NAME: "AEGISX"
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  API_V1_PREFIX: "/api/v1"
  OPENSEARCH_HOST: "opensearch.aegisx.svc.cluster.local"
  RABBITMQ_HOST: "rabbitmq.aegisx.svc.cluster.local"
---
apiVersion: v1
kind: Secret
metadata:
  name: aegisx-secrets
  namespace: aegisx
type: Opaque
stringData:
  SECRET_KEY: "REPLACE-WITH-STRONG-SECRET-KEY"
  JWT_SECRET_KEY: "REPLACE-WITH-STRONG-JWT-SECRET"
  POSTGRES_PASSWORD: "REPLACE-WITH-DB-PASSWORD"
  REDIS_PASSWORD: "REPLACE-WITH-REDIS-PASSWORD"
  AGENT_REGISTRATION_KEY: "REPLACE-WITH-AGENT-KEY"
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: aegisx
  labels:
    app: aegisx-backend
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: aegisx-backend
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: aegisx
  labels:
    app: aegisx-frontend
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
      protocol: TCP
      name: http
  selector:
    app: aegisx-frontend
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aegisx-ingress
  namespace: aegisx
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - aegisx.example.com
      secretName: aegisx-tls
  rules:
    - host: aegisx.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
