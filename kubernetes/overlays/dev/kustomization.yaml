apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: AEGIS

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: backend
        namespace: AEGIS
      spec:
        replicas: 1
    target:
      kind: Deployment
      name: backend
